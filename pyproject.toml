[project]
name = "checkrep"
version = "0.1"
description = "Check reputation for indicators of compromise"
readme = "README.md"
authors = [{name = "Isabel González"}]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "click",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[project.urls]
Homepage = "https://github.com/isomoth/checkrep"
Changelog = "https://github.com/isomoth/checkrep/releases"
Issues = "https://github.com/isomoth/checkrep/issues"
CI = "https://github.com/isomoth/checkrep/actions"

[project.scripts]
checkrep = "checkrep.cli:check_reputation"

[project.optional-dependencies]
test = ["pytest"]
